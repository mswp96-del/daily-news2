<style>
  :root{
    --navy:#1B2A41;

    --ivory:#FAF6EF;

    --line:#E6DFD3;
    --text:#2B2B2B;
    --muted:#8A8175;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ivory); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 72px}
  header h1{
    font-family:"Noto Serif KR",serif; font-size:26px; margin:0 0 6px;
    color:var(--navy); letter-spacing:-.4px;
  }
  header .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  header .sub a{color:var(--brass);text-decoration:none;border-bottom:1px solid #E3D4BC}
  #q{
    width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;
    background:#fff;font-size:14.5px;font-family:inherit;outline:none;
  }
  #q:focus{border-color:var(--brass)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:#4A4438;
    transition:.15s;
  }
  .chip:hover{border-color:var(--brass)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip .n{color:var(--muted);font-size:12px}
  .chip.on .n{color:#C8D0DC}
  section{margin-bottom:34px}
  .sechead{display:flex;align-items:center;gap:9px;margin:0 0 6px}
  .sechead .dot{width:11px;height:11px;border-radius:50%}
  .sechead h2{font-size:17px;margin:0;color:var(--navy);font-weight:700}
  .sechead .n{font-size:12.5px;color:var(--muted)}
  .rule{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{
    display:flex;flex-direction:column;justify-content:space-between;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 14px;text-decoration:none;color:inherit;min-height:120px;
    transition:.15s;
  }
  .card:hover{border-color:var(--brass);transform:translateY(-2px);box-shadow:0 6px 18px rgba(27,42,65,.07)}
  .card .t{font-size:14.5px;font-weight:600;color:#22201C;letter-spacing:-.2px}
  .card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:999px}
  .tag .dot{width:6px;height:6px;border-radius:50%}
  .dur{font-size:11.5px;color:#6B6459;background:#F3EEE5;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .new{
    font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--brass);
    border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:2px;
  }
  .note{font-size:11.5px;color:var(--muted);margin-top:4px}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13.5px;padding:18px 2px}
  @media(max-width:520px){ .wrap{padding:22px 14px 56px} .grid{grid-template-columns:1fr} }
</style>
</head>

/* ===== 영상 데이터 (자동 갱신 영역 끝) ===== */

const NEW_DAYS = 7;
const colorOf = k => (CATS.find(c => c.k === k) || {color:"#8A8175"}).color;

function toSec(d){
  if(!d) return 1e9;
  const p = d.split(":").map(Number);
  return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
}
function isNew(v){
  const base = new Date(SYNCED_AT.slice(0,10) + "T00:00:00");
  const added = new Date(v.a + "T00:00:00");
  return (base - added) / 86400000 <= NEW_DAYS;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}
function card(v){
  const c = colorOf(v.c);
  return '<a class="card" href="https://app.notion.com/p/' + v.i + '" target="_blank" rel="noopener">' +
    '<div class="t">' + esc(v.t) + (isNew(v) ? '<span class="new">NEW</span>' : '') + '</div>' +
    '<div class="meta">' +
      '<span class="tag" style="color:' + c + ';background:' + c + '14">' +
        '<span class="dot" style="background:' + c + '"></span>' + esc(v.c) + '</span>' +
      (v.d ? '<span class="dur">▶ ' + esc(v.d) + '</span>' : '') +
    '</div></a>';
}
function section(title, color, items, note){
  return '<section>' +
    '<div class="sechead"><span class="dot" style="background:' + color + '"></span>' +
    '<h2>' + esc(title) + '</h2><span class="n">' + items.length + '편</span></div>' +
    (note ? '<div class="note">' + esc(note) + '</div>' : '') +
    '<div class="rule"></div>' +
    '<div class="grid">' + items.map(card).join("") + '</div></section>';
}

let active = "전체";

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const pool = VIDEOS.filter(v =>
    (active === "전체" || v.c === active) &&
    (!q || v.t.toLowerCase().includes(q))
  );
  const out = [];

  if(active === "전체" && !q){
    const fresh = VIDEOS.filter(isNew).sort((a,b) => b.a.localeCompare(a.a));
    if(fresh.length) out.push(section("최근 추가", "#B08D57", fresh, "최근 " + NEW_DAYS + "일 안에 목록에 들어온 영상입니다."));
  }
  CATS.forEach(c => {
    const items = pool.filter(v => v.c === c.k).sort((a,b) => toSec(a.d) - toSec(b.d));
    if(items.length) out.push(section(c.label, c.color, items));
  });

  document.getElementById("out").innerHTML =
    out.length ? out.join("") : '<div class="empty">조건에 맞는 영상이 없습니다.</div>';
}

function chips(){
  const box = document.getElementById("chips");
  const all = [{k:"전체", label:"전체", color:"#1B2A41"}].concat(CATS);
  box.innerHTML = all.map(c => {
    const n = c.k === "전체" ? VIDEOS.length : VIDEOS.filter(v => v.c === c.k).length;
    return '<button class="chip' + (c.k === active ? " on" : "") + '" data-k="' + esc(c.k) + '">' +
      '<span class="dot" style="background:' + c.color + '"></span>' + esc(c.label) +
      '<span class="n">' + n + '</span></button>';
  }).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    active = b.dataset.k;
    chips();
    render();
  });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("synced").textContent = SYNCED_AT;
document.getElementById("total").textContent = VIDEOS.length;
chips();
render();
</script>
